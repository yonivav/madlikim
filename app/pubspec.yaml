name: madlikim
description: "מדליקים: מדליקים נרות חנוכה, כל ערב, עם חברים."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Local storage
  shared_preferences: ^2.3.2

  # Notifications and time zones
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  # Location (only when the user taps "use my location")
  geolocator: ^14.0.0

  # Sharing and links
  share_plus: ^11.0.0
  app_links: ^6.4.0

  # Keep the screen on while reading the blessings
  wakelock_plus: ^1.2.8

  # Social layer (optional: the app falls back to local mode when Firebase is not configured)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/

  fonts:
    - family: FrankRuhlLibre
      fonts:
        - asset: assets/fonts/FrankRuhlLibre.ttf
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo.ttf
