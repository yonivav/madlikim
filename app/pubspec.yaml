name: madlikim
description: "מדליקים: מדליקים נרות חנוכה, כל ערב, עם חברים."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Local storage
  shared_preferences: ^2.3.2

  # Notifications and time zones
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  # Location (only when the user taps "use my location")
  geolocator: ^14.0.0

  # Sharing and links
  share_plus: ^11.0.0
  app_links: ^6.4.0

  # Keep the screen on while reading the blessings
  wakelock_plus: ^1.2.8

  # Social layer (optional: the app falls back to local mode when Firebase is not configured)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# dart run flutter_launcher_icons  (setup.sh runs it)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#101B33"
  adaptive_icon_background: "#101B33"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 23

# dart run flutter_native_splash:create  (setup.sh runs it)
flutter_native_splash:
  color: "#0A1226"
  image: "assets/icon/splash.png"
  android_12:
    color: "#0A1226"
    image: "assets/icon/splash_android12.png"
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/content/

  fonts:
    - family: FrankRuhlLibre
      fonts:
        - asset: assets/fonts/FrankRuhlLibre.ttf
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo.ttf
