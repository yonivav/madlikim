<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: transparent; }
  .row { display: flex; gap: 40px; padding: 40px; background: #555; flex-wrap: wrap; align-items: flex-end; }
  svg { display: block; }
</style></head>
<body>
<div class="row" id="row"></div>
<script>
// Variants: full (opaque bg), fg (transparent, scaled for adaptive safe zone),
// mono (white silhouette), splash (transparent, mark only)
function mark({flameOnly = false, mono = false} = {}) {
  const brass = mono ? '#fff' : 'url(#brass)';
  return `
  <!-- arched window -->
  <path d="M292 820 V 452 A 220 220 0 0 1 732 452 V 820" fill="${mono ? 'none' : 'url(#glass)'}"/>
  ${mono ? '' : `<ellipse cx="512" cy="520" rx="210" ry="230" fill="url(#glow)"/>`}
  <path d="M292 820 V 452 A 220 220 0 0 1 732 452 V 820" fill="none"
        stroke="${brass}" stroke-width="40" stroke-linejoin="round"/>
  <!-- sill -->
  <rect x="240" y="806" width="544" height="46" rx="14" fill="${brass}"/>
  <!-- candle -->
  <rect x="482" y="600" width="60" height="206" rx="10" fill="${mono ? '#fff' : 'url(#wax)'}"/>
  <!-- flame -->
  <path d="M512 586 C 452 552, 470 470, 512 404 C 554 470, 572 552, 512 586 Z" fill="${mono ? '#fff' : 'url(#flame)'}"/>
  ${mono ? '' : `<ellipse cx="512" cy="570" rx="9" ry="11" fill="#8FB2FF" opacity=".5"/>`}
  `;
}
const defs = `<defs>
  <radialGradient id="bg" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#22325A"/><stop offset=".6" stop-color="#101B33"/><stop offset="1" stop-color="#0A1226"/></radialGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C66B"/><stop offset=".55" stop-color="#D9A441"/><stop offset="1" stop-color="#A9762A"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3D66"/><stop offset="1" stop-color="#16244A"/></linearGradient>
  <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E4D5BA"/><stop offset=".45" stop-color="#FFF9EE"/><stop offset="1" stop-color="#D3C2A4"/></linearGradient>
  <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFF6D6"/><stop offset=".42" stop-color="#FFC861"/><stop offset="1" stop-color="#F07F3C"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#FFC861" stop-opacity=".6"/><stop offset=".4" stop-color="#FFB24A" stop-opacity=".22"/><stop offset="1" stop-color="#FFC861" stop-opacity="0"/></radialGradient>
</defs>`;
const svg = (id, inner, size = 1024, bg = true, scale = 1) =>
  `<svg id="${id}" width="${size}" height="${size}" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${defs}
   ${bg ? '<rect width="1024" height="1024" fill="url(#bg)"/>' : ''}
   <g transform="translate(512 512) scale(${scale}) translate(-512 -540)">${inner}</g></svg>`;
const row = document.getElementById('row');
row.innerHTML =
  svg('full', mark(), 1024, true, 1.0) +
  svg('fg', mark(), 1024, false, 0.62) +
  svg('mono', mark({mono: true}), 1024, false, 0.62) +
  svg('splash', mark(), 1024, false, 0.9) +
  svg('splash12', mark(), 1152, false, 0.62);
</script>
</body></html>
