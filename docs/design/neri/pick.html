<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><script src="neri.js"></script>
<style>
@font-face { font-family: Fredoka; src: url(../../../app/assets/fonts/Fredoka.ttf); font-weight: 300 700; }
@font-face { font-family: Rubik; src: url(../../../app/assets/fonts/Rubik.ttf); font-weight: 300 900; }
@font-face { font-family: FRL; src: url(../../../app/assets/fonts/FrankRuhlLibre.ttf); font-weight: 300 900; }
:root{--paper:#F6F0E3;--ink:#1E2340;--orange:#F26B2A;--gold:#FFC63A;--muted:#7A7466}
*{box-sizing:border-box;margin:0}
body{background:#3a3d46;padding:30px;font-family:Rubik;color:var(--ink);display:flex;gap:30px;align-items:flex-start}
.sheet{background:var(--paper);border-radius:24px;padding:20px 24px;display:grid;grid-template-columns:repeat(6,150px);gap:10px 18px;text-align:center}
.sheet .c{height:210px}.sheet .n{font-family:Fredoka;font-weight:600;font-size:20px}.sheet .l{font-size:12.5px;color:var(--muted)}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--paper);position:relative;flex:none}
h1{font-family:FRL;font-size:30px;text-align:center;margin-top:62px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
.hero{height:250px;position:relative;margin-top:8px}
.hero .m{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:150px;height:225px}
.bubble{margin:10px 70px 0;background:#FFFBF2;border:2px solid var(--ink);border-radius:14px;padding:7px 12px;text-align:center;font-weight:500;box-shadow:3px 3px 0 var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 18px 0}
.card{background:#FFFDF8;border:2px solid var(--ink);border-radius:18px;padding:6px 0 6px;text-align:center;box-shadow:2px 3px 0 var(--ink)}
.card.on{background:#FFF0C7;box-shadow:0 0 0 4px var(--gold),2px 3px 0 var(--ink)}
.card .c{height:96px}.card .n{font-family:Fredoka;font-weight:600;font-size:16px}
.cta{position:absolute;left:26px;right:26px;bottom:30px;height:58px;border-radius:30px;background:linear-gradient(#FF8A4C,var(--orange));color:#fff;display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:20px;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
</style></head><body>
<div class="sheet" id="sheet"></div>
<div class="phone">
  <h1>בחרו את הנר שלכם</h1><div class="sub">הוא יזכיר לכם להדליק, ויחגוג איתכם כל ערב</div>
  <div class="bubble" id="bub"></div>
  <div class="hero"><div class="m" id="hero"></div></div>
  <div class="grid" id="grid"></div>
  <div class="cta">זה הנר שלי!</div>
</div>
<script>
const s=document.getElementById('sheet');
s.innerHTML = CHARACTERS.map(c=>`<div><div class="c">${neri({look:c,mood:'happy',arms:'wave'})}</div><div class="n">${c.name}</div><div class="l">${c.line}</div></div>`).join('')
 + CHARACTERS.map((c,i)=>`<div><div class="c">${neri({look:c,mood:['excited','wink','happy','calm','sleep','excited'][i],lit:i!==4,arms:['up','down','up','down','down','wave'][i],sleepyZ:i===4})}</div></div>`).join('');
const sel=0;
document.getElementById('bub').textContent='היי! אני '+CHARACTERS[sel].name+' 👋';
document.getElementById('hero').innerHTML=neri({look:CHARACTERS[sel],mood:'excited',arms:'wave'});
document.getElementById('grid').innerHTML=CHARACTERS.map((c,i)=>`<div class="card ${i===sel?'on':''}"><div class="c">${neri({look:c,mood:i===sel?'excited':'happy'})}</div><div class="n">${c.name}</div></div>`).join('');
</script></body></html>
