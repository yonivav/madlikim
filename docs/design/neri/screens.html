<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url(../../../app/assets/fonts/Fredoka.ttf); font-weight: 300 700; }
@font-face { font-family: Rubik; src: url(../../../app/assets/fonts/Rubik.ttf); font-weight: 300 900; }
@font-face { font-family: FRL; src: url(../../../app/assets/fonts/FrankRuhlLibre.ttf); font-weight: 300 900; }
:root { --paper:#F6F0E3; --paper2:#EDE3CD; --ink:#1E2340; --orange:#F26B2A; --orange2:#FF8A4C; --blue:#3F74E6; --gold:#FFC63A; --muted:#7A7466; --night:#1C2463; --night2:#2E2C78; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:#3a3d46;padding:30px;font-family:Rubik,sans-serif;color:var(--ink)}
.grid{display:flex;flex-wrap:wrap;gap:28px}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--paper)}
.status{height:50px}
.serif{font-family:FRL,serif;font-weight:700}
.fred{font-family:Fredoka}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:4px 20px 0}
.tile{width:54px;border-radius:12px;background:#fff;border:2px solid var(--ink);overflow:hidden;text-align:center;box-shadow:2px 3px 0 var(--ink)}
.tile b{display:block;font-family:FRL;font-size:22px;line-height:30px}
.tile span{display:block;background:var(--blue);color:#fff;font-size:11px;font-weight:600;line-height:17px}
.bignum{flex:1}
.bignum h1{font-family:FRL;font-size:31px;line-height:1.05}
.bignum p{font-size:13.5px;color:var(--muted);margin-top:3px}
.chip{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:4px 10px;font-family:Fredoka;font-weight:600;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
/* speech bubble */
.bubble{margin:18px 26px 0;background:#FFFBF2;border:2px solid var(--ink);border-radius:14px;padding:9px 14px;text-align:center;font-size:15.5px;font-weight:500;box-shadow:3px 3px 0 var(--ink);position:relative}
.bubble::after{content:'';position:absolute;bottom:-10px;left:50%;width:16px;height:16px;background:#FFFBF2;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
/* stage with rising light */
.stage{position:relative;height:330px;margin-top:14px;overflow:hidden}
.light{position:absolute;left:0;right:0;bottom:0}
.light svg{display:block;width:100%;height:100%}
.mascot{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:180px;height:270px}
.olive{position:absolute;bottom:0;opacity:.55}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px #FFE08A}
/* actions */
.circles{display:flex;justify-content:center;gap:16px;margin-top:6px}
.circ{width:58px;text-align:center;font-size:11.5px;color:var(--muted);font-weight:500}
.circ i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-style:normal;font-size:22px;box-shadow:2px 3px 0 var(--ink)}
.cta{margin:14px 26px 0;height:58px;border-radius:30px;background:linear-gradient(180deg,var(--orange2),var(--orange));color:#fff;display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:21px;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.cta.ghost{background:#fff;color:var(--ink)}
.tabs{position:absolute;bottom:22px;left:18px;right:18px;height:62px;border-radius:31px;background:#fff;border:2px solid var(--ink);display:flex;justify-content:space-around;align-items:center;box-shadow:0 3px 0 var(--ink)}
.tab{text-align:center;font-size:11px;color:var(--muted);font-weight:500;width:70px}
.tab i{display:block;font-style:normal;font-size:19px;line-height:24px}
.tab.on{color:var(--ink);font-weight:700}
.tab.on i{background:var(--gold);border-radius:14px;width:44px;margin:0 auto;border:1.5px solid var(--ink)}
/* lighting */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.hdr h1{font-family:FRL;font-size:30px}
.x{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;background:#fff}
.steps{margin:6px 22px 0}
.step{display:flex;gap:12px;align-items:center;padding:7px 0;font-size:15.5px}
.step b.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:Fredoka;border:2px solid var(--ink)}
.card{margin:12px 18px 0;background:#FFFDF8;border:2px solid var(--ink);border-radius:20px;padding:14px 18px 10px;box-shadow:3px 4px 0 var(--ink)}
.card p.pr{font-family:FRL;font-size:23px;line-height:1.75;font-weight:500}
.card .m{font-size:13.5px;color:var(--blue);font-weight:600}
.peek{position:absolute;width:96px;height:140px}
/* celebrate + night */
.night{background:radial-gradient(90% 60% at 50% 30%,#3B3A8E 0%,var(--night) 60%,#121640 100%);color:#fff}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff}
.conf{position:absolute;width:9px;height:14px;border-radius:2px}
.plus{text-align:center;font-family:Fredoka;font-weight:700;font-size:54px;color:var(--gold);text-shadow:0 3px 0 #B3561C}
.night .bubble{color:var(--ink)}
.row8{display:flex;justify-content:center;gap:2px;margin-top:10px}
.row8 div{width:40px;height:62px}
/* gang */
.shelf{position:relative;margin:16px 14px 0;height:170px;border-radius:24px;background:linear-gradient(180deg,#2B3380,#1C2463);border:2px solid var(--ink);box-shadow:3px 4px 0 var(--ink);overflow:hidden}
.shelf .plank{position:absolute;left:10px;right:10px;bottom:24px;height:12px;border-radius:6px;background:#D9A441;border:2px solid var(--ink)}
.shelf .b8{position:absolute;left:12px;right:12px;bottom:34px;display:flex;justify-content:space-between}
.shelf .b8 div{width:42px;height:66px}
.stats{display:flex;gap:10px;margin:16px 18px 0}
.stat{flex:1;background:#fff;border:2px solid var(--ink);border-radius:16px;text-align:center;padding:8px 0;box-shadow:2px 3px 0 var(--ink)}
.stat b{display:block;font-family:Fredoka;font-size:28px}
.stat span{font-size:12px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:14px 18px 0}
.badge{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:5px 10px;font-size:13.5px;font-weight:500}
.badge.off{opacity:.38;border-style:dashed}
h2.sec{font-family:FRL;font-size:22px;margin:18px 22px 0}
/* onboarding */
.input{margin:14px 26px 0;height:54px;border-radius:16px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;padding:0 16px;font-size:18px}
.seg{display:flex;gap:8px;justify-content:center;margin-top:14px}
.seg span{border:2px solid var(--ink);border-radius:14px;padding:6px 16px;background:#fff;font-weight:500}
.seg span.on{background:var(--gold)}
/* marketing */
.mk{background:radial-gradient(70% 45% at 50% 52%,#3E58D8 0%,#2638A8 45%,#141C66 100%)}
.ring{position:absolute;left:50%;top:52%;border-radius:50%;border:2px solid rgba(255,255,255,.12);transform:translate(-50%,-50%)}
.mk h1{font-family:Fredoka;font-weight:700;text-align:center;line-height:1.05}
.mk .l1{font-size:46px;color:#FFF6E6;margin-top:64px}
.mk .l2{font-size:52px;color:#FF8A3C;text-shadow:0 3px 0 #8A2E0A}
.mini{position:absolute;width:230px;height:470px;left:44px;top:250px;border-radius:34px;border:7px solid #11142E;background:var(--paper);overflow:hidden;transform:rotate(-6deg);box-shadow:0 30px 60px rgba(0,0,0,.45)}
</style>
<script src="neri.js"></script>
</head><body><div class="grid" id="grid"></div>
<script>
const olive = (flip) => `<svg width="120" height="110" viewBox="0 0 120 110" style="transform:scaleX(${flip?-1:1})"><g fill="none" stroke="#5E6B3A" stroke-width="2.2" stroke-linecap="round">
  <path d="M10 108 Q 40 70 96 20"/>${[[30,82,-40],[44,66,30],[58,54,-35],[70,42,28],[84,30,-30],[96,20,10]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="13" ry="5" transform="rotate(${r} ${x} ${y})" fill="#9DAA6A" fill-opacity=".55"/>`).join('')}
  <circle cx="52" cy="76" r="5" fill="#3E4A2A"/><circle cx="78" cy="52" r="5" fill="#3E4A2A"/></g></svg>`;
const lightWave = (frac, night=false) => {
  const h = Math.round(330*frac);
  return `<div class="light" style="height:${h+30}px"><svg viewBox="0 0 390 ${h+30}" preserveAspectRatio="none">
   <defs><linearGradient id="lw${frac}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A6"/><stop offset="1" stop-color="#FFC94F"/></linearGradient></defs>
   <path d="M0 18 Q 50 0 100 14 T 200 14 T 300 12 T 390 14 V ${h+30} H 0 Z" fill="url(#lw${frac})" opacity=".85"/>
   <path d="M0 26 Q 60 12 120 24 T 240 22 T 390 24" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/></svg></div>`;
};
const tabs = (on) => `<div class="tabs">${[['🏠','בית'],['🕎','החנוכייה'],['👨‍👩‍👧','חבר\'ה'],['🎶','שירים']].map(([i,t],k)=>`<div class="tab ${k===on?'on':''}"><i>${i}</i>${t}</div>`).join('')}</div>`;
const sparks = (n, area) => Array.from({length:n},(_,i)=>`<div class="spark" style="left:${(i*73)%area[0]+area[2]}px;top:${(i*41)%area[1]+area[3]}px;opacity:${.4+(i%3)*.2}"></div>`).join('');

const screens = [];
// 1. HOME, lighting window
screens.push(['בית: הגיע הזמן', `
 <div class="status"></div>
 <div class="top">
   <div class="tile"><b>כ״ח</b><span>כסלו</span></div>
   <div class="bignum"><h1>נר רביעי</h1><p>3 לילות מתוך 8 · 10 אור</p></div>
   <div class="chip">🔥 3</div>
 </div>
 <div class="bubble">הגיע הזמן! אני כבר מתרגש 🕯️</div>
 <div class="stage">${lightWave(3/8)}${sparks(6,[300,90,40,190])}
   <div class="olive" style="right:-10px">${olive(false)}</div><div class="olive" style="left:-10px">${olive(true)}</div>
   <div class="mascot">${neri({mood:'excited',arms:'up'})}</div></div>
 <div class="circles"><div class="circ"><i>🎶</i>שירים</div><div class="circ"><i>👨‍👩‍👧</i>החבר'ה</div><div class="circ"><i>🏠</i>להזמין</div></div>
 <div class="cta">מדליקים 🔥</div>
 ${tabs(0)}`]);

// 2. LIGHTING
const menorahBuddies = () => {
  // ink-line hanukkiah with 4 tonight candles (buddies) on the right, numbers above
  let s = `<svg viewBox="0 0 360 170" width="100%" height="170">
   <path d="M20 128 H340" stroke="#1E2340" stroke-width="7" stroke-linecap="round"/>
   <path d="M30 130 Q 100 165 180 165 Q 260 165 330 130" stroke="#1E2340" stroke-width="4" fill="none"/>
   <path d="M180 128 V 166 M150 168 H210" stroke="#1E2340" stroke-width="6" stroke-linecap="round"/>
   <path d="M180 128 V 92" stroke="#1E2340" stroke-width="5"/>`;
  const xs = [324,288,252,216,144,108,72,36];
  xs.forEach((x)=>{ s += `<rect x="${x-12}" y="118" width="24" height="10" rx="3" fill="#D9A441" stroke="#1E2340" stroke-width="2"/>`; });
  s += `<rect x="168" y="82" width="24" height="10" rx="3" fill="#D9A441" stroke="#1E2340" stroke-width="2"/></svg>`;
  return s;
};
screens.push(['מסך הדלקה', `
 <div class="status"></div>
 <div class="hdr"><div class="x">✕</div><h1>נר רביעי</h1><div style="width:36px"></div></div>
 <div style="text-align:center;color:var(--muted);font-size:13.5px">אור לכ״ח בכסלו</div>
 <div style="position:relative;height:200px;margin:4px 14px 0">
   <div style="position:absolute;inset:auto 0 0 0">${menorahBuddies()}</div>
   ${[324,288,252,216].map((x,i)=>`<div style="position:absolute;left:${(x-21)/360*362}px;top:88px;width:42px;height:64px">${neri({color:NIGHT_COLORS[i],mood:'happy'})}</div>
      <div style="position:absolute;left:${(x-11)/360*362}px;top:56px;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;border:2px solid var(--ink);font:600 12px/18px Fredoka;text-align:center">${4-i}</div>`).join('')}
   <div style="position:absolute;left:${(180-21)/360*362}px;top:52px;width:42px;height:64px">${neri({color:'neri',mood:'wink',lit:true,glow:.6})}</div>
 </div>
 <div class="steps">
  <div class="step"><b class="n">1</b>מניחים <b>4 נרות</b> מימין לשמאל</div>
  <div class="step"><b class="n">2</b>מדליקים את השמש ומברכים</div>
  <div class="step"><b class="n">3</b>מדליקים משמאל לימין, לפי המספרים</div>
 </div>
 <div class="card"><p class="pr">בָּרוּךְ אַתָּה ה׳ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לְהַדְלִיק נֵר שֶׁל חֲנֻכָּה.</p><div class="m">מה זה אומר?</div></div>
 <div class="peek" style="left:-14px;bottom:96px;transform:rotate(12deg)">${neri({mood:'happy',arms:'point'})}</div>
 <div class="cta" style="position:absolute;left:0;right:0;bottom:24px">הדלקתי! 🔥</div>`]);

// 3. CELEBRATE
const conf = Array.from({length:22},(_,i)=>`<div class="conf" style="left:${(i*53)%370+8}px;top:${(i*97)%330+60}px;background:${['#FFC63A','#FF8FAE','#7FB0FF','#86E3C2','#FF8A4C'][i%5]};transform:rotate(${i*37}deg)"></div>`).join('');
const stars = Array.from({length:30},(_,i)=>`<div class="star" style="left:${(i*131)%380}px;top:${(i*71)%300+40}px;opacity:${.25+(i%4)*.15}"></div>`).join('');
screens.push(['אחרי "הדלקתי"', `<div class="night" style="position:absolute;inset:0">${stars}${conf}
 <div style="position:absolute;left:50%;top:112px;transform:translateX(-50%);width:200px;height:300px">${neri({mood:'excited',lit:true,arms:'up'})}</div>
 <div style="position:absolute;top:440px;left:0;right:0">
  <div class="plus" style="display:flex;justify-content:center;gap:12px"><span style="direction:ltr">+4</span><span>אור</span></div>
  <div class="bubble" style="margin-top:8px">וואו! איזה אור. גם השכנים רואים 😉</div>
  <div class="row8">${NIGHT_COLORS.slice(0,4).map(c=>`<div>${neri({color:c,mood:'happy',lit:true,glow:.5})}</div>`).join('')}</div>
 </div>
 <div class="cta" style="position:absolute;left:0;right:0;bottom:92px">לשתף את החבר'ה</div>
 <div class="cta ghost" style="position:absolute;left:0;right:0;bottom:22px">מעוז צור, עם אקורדים</div></div>`]);

// 4. GANG
screens.push(['החנוכייה שלי', `
 <div class="status"></div>
 <div class="hdr"><div class="x">›</div><h1>החבר'ה של נרי</h1><div style="width:36px"></div></div>
 <div style="text-align:center;color:var(--muted);font-size:14px;margin-top:2px">כל לילה שמדליקים, מצטרף חבר חדש</div>
 <div class="shelf">${stars.slice(0,400)}<div class="plank"></div>
   <div class="b8">${NIGHT_COLORS.map((c,i)=>`<div>${neri({color:c,mood:i<3?'happy':(i===3?'excited':'sleep'),lit:i<3,glow:.55})}</div>`).reverse().join('')}</div></div>
 <div class="stats"><div class="stat"><b>10</b><span>אור</span></div><div class="stat"><b>3/8</b><span>לילות</span></div><div class="stat"><b>🔥 3</b><span>ברצף</span></div></div>
 <h2 class="sec">תגים</h2>
 <div class="badges"><span class="badge">✨ הנר הראשון</span><span class="badge">🕯️🕯️ ערב שבת</span><span class="badge off">🕎 חנוכייה שלמה</span><span class="badge off">🏠 בית פתוח</span><span class="badge off">🤝 מביא חברים</span><span class="badge off">🌙 עוד לא מאוחר</span></div>
 ${tabs(1)}`]);

// 5. SHABBAT
screens.push(['שבת', `<div class="night" style="position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 40%,#3A3263 0%,#1A1D4A 60%,#0F1233 100%)">${stars}
 <div style="position:absolute;left:50%;top:170px;transform:translateX(-50%);width:200px;height:300px">${neri({mood:'sleep',sleepyZ:true})}</div>
 <div style="position:absolute;top:500px;left:0;right:0;text-align:center">
  <div class="serif" style="font-size:48px">שבת שלום</div>
  <div style="color:#C9C6E8;font-size:17px;line-height:1.6;margin-top:8px">נרי נח עכשיו.<br>נתראה במוצאי שבת ב־17:31</div></div></div>`]);

// 6. ONBOARDING
screens.push(['פתיחה', `
 <div class="status"></div>
 <div style="height:40px"></div>
 <div class="bubble" style="margin:0 60px">היי! אני נרי 👋</div>
 <div style="position:relative;height:300px;margin-top:10px">
   <div class="olive" style="right:10px;bottom:10px">${olive(false)}</div>
   <div class="mascot" style="bottom:0">${neri({mood:'happy',arms:'wave'})}</div></div>
 <h1 class="serif" style="text-align:center;font-size:30px;margin-top:10px">אני אזכיר לך להדליק<br>כל ערב בחנוכה</h1>
 <div class="input" style="color:#B0A890">איך לקרוא לך?</div>
 <div class="seg"><span>אתה</span><span>את</span><span class="on">אתם</span></div>
 <div class="cta" style="position:absolute;left:0;right:0;bottom:30px">יאללה</div>`]);

// 7. MARKETING
const rings = [140,220,300,380,460,540].map(r=>`<div class="ring" style="width:${r}px;height:${r}px"></div>`).join('');
screens.push(['צילום לחנות', `<div class="mk" style="position:absolute;inset:0">${rings}
 <h1 class="l1">תזכורת עדינה</h1><h1 class="l2">להדליק נרות</h1>
 <div class="mini"><div style="transform:scale(.59);transform-origin:top right;width:390px;position:absolute;right:0;top:0">
   <div class="status"></div><div class="top"><div class="tile"><b>כ״ח</b><span>כסלו</span></div><div class="bignum"><h1>נר רביעי</h1><p>3 לילות מתוך 8</p></div></div>
   <div class="bubble">הגיע הזמן! אני כבר מתרגש 🕯️</div>
   <div class="stage">${lightWave(3/8)}<div class="mascot">${neri({mood:'excited',arms:'up'})}</div></div>
   <div class="cta">מדליקים 🔥</div></div></div>
 <div style="position:absolute;right:-6px;bottom:40px;width:230px;height:345px">${neri({mood:'wink',lit:true,arms:'wave'})}</div>
 <div style="position:absolute;right:150px;bottom:250px;width:64px;height:64px">
   <svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="26" fill="#E3A15A" stroke="#1E2340" stroke-width="2.5"/><path d="M8 30 Q 14 10 32 10 Q 50 10 56 30 Q 50 26 44 32 Q 38 24 32 30 Q 26 24 20 32 Q 14 26 8 30 Z" fill="#FF8FAE" stroke="#1E2340" stroke-width="2.5"/>
   ${[[20,20,'#fff'],[30,16,'#FFC63A'],[40,20,'#7FB0FF'],[26,26,'#86E3C2'],[44,26,'#fff']].map(([x,y,c])=>`<rect x="${x}" y="${y}" width="6" height="2.5" rx="1" fill="${c}" transform="rotate(${x*7} ${x} ${y})"/>`).join('')}</svg></div>
 </div>`]);

document.getElementById('grid').innerHTML = screens.map(([l, h]) =>
  `<div><div style="color:#bbb;font:13px Rubik;margin:0 8px 6px">${l}</div><div class="phone">${h}</div></div>`).join('');
</script></body></html>
