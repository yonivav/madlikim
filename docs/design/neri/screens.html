<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url(../../../app/assets/fonts/Fredoka.ttf); font-weight: 300 700; }
@font-face { font-family: Rubik; src: url(../../../app/assets/fonts/Rubik.ttf); font-weight: 300 900; }
@font-face { font-family: FRL; src: url(../../../app/assets/fonts/FrankRuhlLibre.ttf); font-weight: 300 900; }
:root { --paper:#F7F1E4; --ink:#1E2340; --orange:#F26B2A; --orange2:#FF9A5C; --blue:#3F74E6; --blue2:#6F9BFF; --gold:#FFC63A; --gold2:#FFE08A; --muted:#857E70; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:#3a3d46;padding:30px;font-family:Rubik,sans-serif;color:var(--ink)}
.grid{display:flex;flex-wrap:wrap;gap:28px}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  background:radial-gradient(60% 30% at 85% 8%,#FFE3C8 0%,transparent 70%),radial-gradient(70% 35% at 0% 60%,#FFF0C4 0%,transparent 70%),var(--paper)}
.status{height:50px}
.serif{font-family:FRL,serif;font-weight:700}

/* ---- the gloss: soft colored glow under, light rim inside, a shine on top ---- */
.gl{position:relative;isolation:isolate}
.gl::before{content:'';position:absolute;left:12%;right:12%;top:3px;height:42%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none;z-index:1}
.pearl{background:linear-gradient(180deg,#FFFFFF 0%,#FFF8EC 100%);
  box-shadow:0 10px 24px -8px rgba(120,80,30,.28),0 2px 4px rgba(120,80,30,.10),inset 0 -3px 0 rgba(222,200,160,.45),inset 0 0 0 1.5px rgba(255,255,255,.9)}
.candy{background:linear-gradient(180deg,var(--orange2) 0%,var(--orange) 55%,#E4561B 100%);color:#fff;
  box-shadow:0 14px 26px -10px rgba(242,107,42,.75),inset 0 -4px 0 rgba(170,50,0,.28),inset 0 0 0 1.5px rgba(255,255,255,.25)}
.sky{background:linear-gradient(180deg,var(--blue2) 0%,var(--blue) 60%,#2E5BC8 100%);color:#fff;
  box-shadow:0 12px 24px -10px rgba(63,116,230,.7),inset 0 -3px 0 rgba(10,30,110,.25)}
.honey{background:linear-gradient(180deg,#FFE48A 0%,var(--gold) 60%,#F2A91E 100%);
  box-shadow:0 10px 20px -8px rgba(242,169,30,.7),inset 0 -3px 0 rgba(160,90,0,.22)}

.top{display:flex;align-items:center;gap:12px;padding:4px 20px 0}
.coin{width:60px;height:60px;border-radius:50%;display:grid;place-content:center;text-align:center}
.coin b{font-family:FRL;font-size:21px;line-height:22px;position:relative;z-index:2}
.coin span{font-size:10.5px;font-weight:600;opacity:.9;position:relative;z-index:2}
.bignum{flex:1}
.bignum h1{font-family:FRL;font-size:31px;line-height:1.05}
.bignum p{font-size:13.5px;color:var(--muted);margin-top:3px}
.chip{display:flex;align-items:center;gap:4px;border-radius:999px;padding:6px 13px;font-family:Fredoka;font-weight:600;font-size:15px}
.chip *{position:relative;z-index:2}

.bubble{margin:18px 34px 0;border-radius:999px;padding:12px 20px;text-align:center;font-size:15.5px;font-weight:500;position:relative}
.bubble::after{content:'';position:absolute;bottom:-9px;left:50%;width:20px;height:20px;border-radius:50%;background:#FFF8EC;transform:translateX(-50%);box-shadow:0 6px 10px -6px rgba(120,80,30,.3)}
.bubble::before{z-index:1}
.bubble span{position:relative;z-index:2}
.dot2{position:absolute;bottom:-20px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:#FFF8EC;box-shadow:0 3px 6px rgba(120,80,30,.25)}

.stage{position:relative;height:330px;margin-top:14px}
.halo{position:absolute;left:50%;bottom:30px;width:300px;height:300px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,120,.75) 0%,rgba(255,214,120,.25) 45%,transparent 70%)}
.disc{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:250px;height:250px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#FFFDF6,#FFF3D6);box-shadow:0 20px 40px -16px rgba(200,120,30,.45),inset 0 0 0 6px rgba(255,255,255,.8)}
.fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#FFE7A0,#FFC447)}
.fill::before{content:'';position:absolute;left:-10%;right:-10%;top:-10px;height:22px;border-radius:50%;background:#FFE7A0}
.fill::after{content:'';position:absolute;left:12%;right:12%;top:2px;height:5px;border-radius:9px;background:rgba(255,255,255,.75)}
.mascot{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:180px;height:270px}
.bubbles span{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.2) 60%,transparent);border:1px solid rgba(255,255,255,.7)}
.olive{position:absolute;bottom:0;opacity:.5}

.circles{display:flex;justify-content:center;gap:18px;margin-top:8px}
.circ{width:62px;text-align:center;font-size:11.5px;color:var(--muted);font-weight:500}
.circ i{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 5px;border-radius:50%;font-style:normal;font-size:23px}
.circ i em{font-style:normal;position:relative;z-index:2}
.cta{margin:14px 26px 0;height:60px;border-radius:999px;display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:21px}
.cta span{position:relative;z-index:2}
.cta.ghost{color:var(--ink)}
.tabs{position:absolute;bottom:22px;left:18px;right:18px;height:66px;border-radius:999px;display:flex;justify-content:space-around;align-items:center}
.tab{text-align:center;font-size:11px;color:var(--muted);font-weight:500;width:70px;position:relative;z-index:2}
.tab i{display:grid;place-items:center;font-style:normal;font-size:19px;width:38px;height:38px;margin:0 auto;border-radius:50%}
.tab.on{color:var(--ink);font-weight:700}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.hdr h1{font-family:FRL;font-size:30px}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.x span{position:relative;z-index:2}
.steps{margin:8px 18px 0;display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;padding:6px 8px 6px 16px;border-radius:999px;font-size:15px}
.step *{position:relative;z-index:2}
.step b.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:Fredoka}
.card{margin:14px 18px 0;border-radius:34px;padding:16px 22px 12px}
.card *{position:relative;z-index:2}
.card p.pr{font-family:FRL;font-size:23px;line-height:1.75;font-weight:500}
.card .m{font-size:13.5px;color:var(--blue);font-weight:600}
.peek{position:absolute;width:96px;height:140px}

.night{background:radial-gradient(90% 60% at 50% 30%,#3B3A8E 0%,#1C2463 60%,#121640 100%);color:#fff}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff}
.conf{position:absolute;border-radius:50%}
.plus{text-align:center;font-family:Fredoka;font-weight:700;font-size:54px;color:var(--gold);text-shadow:0 0 22px rgba(255,198,58,.6)}
.night .bubble{color:var(--ink)}
.row8{display:flex;justify-content:center;gap:2px;margin-top:10px}
.row8 div{width:40px;height:62px}
.nightglass{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));color:#fff;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3),0 14px 30px -12px rgba(0,0,0,.5);backdrop-filter:blur(6px)}

.shelf{position:relative;margin:16px 14px 0;height:180px;border-radius:90px;background:radial-gradient(120% 120% at 50% 0%,#3D46A8,#1C2463 70%);
  box-shadow:0 18px 30px -14px rgba(28,36,99,.7),inset 0 0 0 1.5px rgba(255,255,255,.18);overflow:hidden}
.shelf .b8{position:absolute;left:30px;right:30px;bottom:40px;display:flex;justify-content:space-between}
.shelf .b8 div{width:38px;height:60px}
.shelf .plank{position:absolute;left:24px;right:24px;bottom:30px;height:12px;border-radius:9px;background:linear-gradient(180deg,#FFE08A,#E2A43A)}
.stats{display:flex;justify-content:space-around;margin:18px 18px 0}
.stat{width:96px;height:96px;border-radius:50%;text-align:center;display:grid;place-content:center}
.stat *{position:relative;z-index:2}
.stat b{display:block;font-family:Fredoka;font-size:28px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin:12px 16px 0}
.badge{text-align:center;font-size:11.5px;font-weight:500;color:var(--ink)}
.badge i{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 5px;border-radius:50%;font-style:normal;font-size:24px}
.badge i em{font-style:normal;position:relative;z-index:2}
.badge.off{opacity:.45}
.badge.off i{background:rgba(30,35,64,.06);box-shadow:inset 0 0 0 2px rgba(30,35,64,.12)}
.badge.off i::before{display:none}
h2.sec{font-family:FRL;font-size:22px;margin:18px 22px 0}

.input{margin:14px 26px 0;height:58px;border-radius:999px;display:flex;align-items:center;padding:0 22px;font-size:18px}
.input span{position:relative;z-index:2}
.seg{display:flex;gap:10px;justify-content:center;margin-top:14px}
.seg span{border-radius:999px;padding:8px 20px;font-weight:500;position:relative}
.seg span em{font-style:normal;position:relative;z-index:2}
</style>
<script src="neri.js"></script>
</head><body><div class="grid" id="grid"></div>
<script>
const olive = (flip) => `<svg width="120" height="110" viewBox="0 0 120 110" style="transform:scaleX(${flip?-1:1})"><g fill="none" stroke="#5E6B3A" stroke-width="2.2" stroke-linecap="round">
  <path d="M10 108 Q 40 70 96 20"/>${[[30,82,-40],[44,66,30],[58,54,-35],[70,42,28],[84,30,-30],[96,20,10]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="13" ry="5" transform="rotate(${r} ${x} ${y})" fill="#9DAA6A" fill-opacity=".55"/>`).join('')}
  <circle cx="52" cy="76" r="5" fill="#3E4A2A"/><circle cx="78" cy="52" r="5" fill="#3E4A2A"/></g></svg>`;
const stage = (frac, mood='excited', arms='up') => `<div class="stage"><div class="halo"></div>
  <div class="disc"><div class="fill" style="height:${Math.round(250*frac)}px"></div>
   <div class="bubbles">${[[40,200,10],[70,215,6],[190,205,8],[160,225,5],[210,190,4]].map(([x,y,r])=>`<span style="left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px"></span>`).join('')}</div></div>
  <div class="olive" style="right:-6px">${olive(false)}</div><div class="olive" style="left:-6px">${olive(true)}</div>
  <div class="mascot">${neri({mood,arms})}</div></div>`;
const tabs = (on) => `<div class="tabs gl pearl">${[['🏠','בית'],['🕎','החנוכייה'],['👨‍👩‍👧','חבר\'ה'],['🎶','שירים']].map(([i,t],k)=>`<div class="tab ${k===on?'on':''}"><i class="${k===on?'gl honey':''}">${i}</i>${t}</div>`).join('')}</div>`;
const bubble = (t, style='') => `<div class="bubble gl pearl" style="${style}"><span>${t}</span><div class="dot2"></div></div>`;
const cta = (t, cls='candy', style='') => `<div class="cta gl ${cls}" style="${style}"><span>${t}</span></div>`;

const screens = [];
screens.push(['בית: הגיע הזמן', `
 <div class="status"></div>
 <div class="top">
   <div class="coin gl sky"><b>כ״ח</b><span>כסלו</span></div>
   <div class="bignum"><h1>נר רביעי</h1><p>3 לילות מתוך 8 · 10 אור</p></div>
   <div class="chip gl pearl"><span>🔥 3</span></div>
 </div>
 ${bubble('הגיע הזמן! אני כבר מתרגש 🕯️')}
 ${stage(3/8)}
 <div class="circles">${[['🎶','שירים'],['👨‍👩‍👧','החבר\'ה'],['🏠','להזמין']].map(([e,t])=>`<div class="circ"><i class="gl pearl"><em>${e}</em></i>${t}</div>`).join('')}</div>
 ${cta('מדליקים 🔥')}
 ${tabs(0)}`]);

const menorah = () => {
  let s = `<svg viewBox="0 0 360 170" width="100%" height="170"><defs><linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#D9952E"/></linearGradient></defs>
   <path d="M20 128 H340" stroke="url(#br)" stroke-width="9" stroke-linecap="round"/>
   <path d="M30 130 Q 100 165 180 165 Q 260 165 330 130" stroke="#E2A43A" stroke-width="5" fill="none" stroke-linecap="round"/>
   <path d="M180 128 V 166" stroke="url(#br)" stroke-width="7" stroke-linecap="round"/><ellipse cx="180" cy="167" rx="32" ry="6" fill="url(#br)"/>
   <path d="M180 128 V 92" stroke="url(#br)" stroke-width="6" stroke-linecap="round"/>`;
  [324,288,252,216,144,108,72,36,180].forEach((x)=>{ const y = x===180?86:122; s += `<ellipse cx="${x}" cy="${y}" rx="14" ry="7" fill="url(#br)"/><ellipse cx="${x}" cy="${y-2}" rx="8" ry="2" fill="#fff" opacity=".6"/>`; });
  return s + `</svg>`;
};
screens.push(['מסך הדלקה', `
 <div class="status"></div>
 <div class="hdr"><div class="x gl pearl"><span>✕</span></div><h1>נר רביעי</h1><div style="width:40px"></div></div>
 <div style="text-align:center;color:var(--muted);font-size:13.5px">אור לכ״ח בכסלו</div>
 <div style="position:relative;height:200px;margin:4px 14px 0">
   <div style="position:absolute;left:50%;top:40px;width:280px;height:160px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55),transparent 70%)"></div>
   <div style="position:absolute;inset:auto 0 0 0">${menorah()}</div>
   ${[324,288,252,216].map((x,i)=>`<div style="position:absolute;left:${(x-21)/360*362}px;top:86px;width:42px;height:64px">${neri({color:NIGHT_COLORS[i],mood:'happy'})}</div>
      <div class="gl candy" style="position:absolute;left:${(x-12)/360*362}px;top:52px;width:24px;height:24px;border-radius:50%;font:600 12px/24px Fredoka;text-align:center"><span style="position:relative;z-index:2">${4-i}</span></div>`).join('')}
   <div style="position:absolute;left:${(180-21)/360*362}px;top:50px;width:42px;height:64px">${neri({mood:'wink',lit:true,glow:.6})}</div>
 </div>
 <div class="steps">
  ${[['מניחים <b>4 נרות</b> מימין לשמאל'],['מדליקים את השמש ומברכים'],['מדליקים משמאל לימין, לפי המספרים']].map(([t],i)=>`<div class="step gl pearl"><b class="n gl honey"><span>${i+1}</span></b><span>${t}</span></div>`).join('')}
 </div>
 <div class="card gl pearl"><p class="pr">בָּרוּךְ אַתָּה ה׳ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לְהַדְלִיק נֵר שֶׁל חֲנֻכָּה.</p><div class="m">מה זה אומר?</div></div>
 <div class="peek" style="left:-14px;bottom:96px;transform:rotate(12deg)">${neri({mood:'happy',arms:'point'})}</div>
 ${cta('הדלקתי! 🔥','candy','position:absolute;left:0;right:0;bottom:24px')}`]);

const conf = Array.from({length:26},(_,i)=>{const r=5+(i%4)*3;return `<div class="conf" style="left:${(i*53)%370+8}px;top:${(i*97)%330+60}px;width:${r}px;height:${r}px;background:radial-gradient(circle at 35% 30%,#fff,${['#FFC63A','#FF8FAE','#7FB0FF','#86E3C2','#FF8A4C'][i%5]} 55%)"></div>`}).join('');
const stars = Array.from({length:30},(_,i)=>`<div class="star" style="left:${(i*131)%380}px;top:${(i*71)%300+40}px;opacity:${.25+(i%4)*.15}"></div>`).join('');
screens.push(['אחרי "הדלקתי"', `<div class="night" style="position:absolute;inset:0">${stars}${conf}
 <div style="position:absolute;left:50%;top:90px;transform:translateX(-50%);width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,90,.45),transparent 65%)"></div>
 <div style="position:absolute;left:50%;top:112px;transform:translateX(-50%);width:200px;height:300px">${neri({mood:'excited',lit:true,arms:'up'})}</div>
 <div style="position:absolute;top:440px;left:0;right:0">
  <div class="plus" style="display:flex;justify-content:center;gap:12px"><span style="direction:ltr">+4</span><span>אור</span></div>
  ${bubble('וואו! איזה אור. גם השכנים רואים 😉','margin-top:8px')}
  <div class="row8" style="margin-top:18px">${NIGHT_COLORS.slice(0,4).map(c=>`<div>${neri({color:c,mood:'happy',lit:true,glow:.5})}</div>`).join('')}</div>
 </div>
 ${cta('לשתף את החבר\'ה','candy','position:absolute;left:0;right:0;bottom:92px')}
 ${cta('מעוז צור, עם אקורדים','nightglass','position:absolute;left:0;right:0;bottom:22px')}</div>`]);

screens.push(['החנוכייה שלי', `
 <div class="status"></div>
 <div class="hdr"><div class="x gl pearl"><span>›</span></div><h1>החבר'ה של נרי</h1><div style="width:40px"></div></div>
 <div style="text-align:center;color:var(--muted);font-size:14px;margin-top:2px">כל לילה שמדליקים, מצטרף חבר חדש</div>
 <div class="shelf">${stars}<div class="plank"></div>
   <div class="b8">${NIGHT_COLORS.map((c,i)=>`<div>${neri({color:c,mood:i<3?'happy':(i===3?'excited':'sleep'),lit:i<3,glow:.55})}</div>`).reverse().join('')}</div></div>
 <div class="stats"><div class="stat gl honey"><b>10</b><span style="color:#7a4a00">אור</span></div><div class="stat gl pearl"><b>3/8</b><span>לילות</span></div><div class="stat gl pearl"><b>🔥 3</b><span>ברצף</span></div></div>
 <h2 class="sec">תגים</h2>
 <div class="badges">${[['✨','הנר הראשון',1],['🕯️','ערב שבת',1],['🕎','חנוכייה שלמה',0],['🏠','בית פתוח',0],['🤝','מביא חברים',0],['🌙','עוד לא מאוחר',0]].map(([e,t,on])=>`<div class="badge ${on?'':'off'}"><i class="gl ${on?'honey':''}"><em>${e}</em></i>${t}</div>`).join('')}</div>
 ${tabs(1)}`]);

screens.push(['שבת', `<div class="night" style="position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 40%,#3A3263 0%,#1A1D4A 60%,#0F1233 100%)">${stars}
 <div style="position:absolute;left:50%;top:130px;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(160,150,255,.25),transparent 65%)"></div>
 <div style="position:absolute;left:50%;top:170px;transform:translateX(-50%);width:200px;height:300px">${neri({mood:'sleep',sleepyZ:true})}</div>
 <div style="position:absolute;top:500px;left:0;right:0;text-align:center">
  <div class="serif" style="font-size:48px">שבת שלום</div>
  <div style="color:#C9C6E8;font-size:17px;line-height:1.6;margin-top:8px">נרי נח עכשיו.<br>נתראה במוצאי שבת ב־17:31</div></div></div>`]);

screens.push(['פתיחה', `
 <div class="status"></div>
 <div style="height:30px"></div>
 ${bubble('היי! אני נרי 👋','margin:0 90px')}
 ${stage(.2,'happy','wave')}
 <h1 class="serif" style="text-align:center;font-size:30px;margin-top:6px">אני אזכיר לך להדליק<br>כל ערב בחנוכה</h1>
 <div class="input gl pearl" style="color:#B0A890"><span>איך לקרוא לך?</span></div>
 <div class="seg">${['אתה','את','אתם'].map((t,i)=>`<span class="gl ${i==2?'honey':'pearl'}"><em>${t}</em></span>`).join('')}</div>
 ${cta('יאללה','candy','position:absolute;left:0;right:0;bottom:30px')}`]);

document.getElementById('grid').innerHTML = screens.map(([l, h]) =>
  `<div><div style="color:#bbb;font:13px Rubik;margin:0 8px 6px">${l}</div><div class="phone">${h}</div></div>`).join('');
</script></body></html>
